<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Radio Sikodark</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background:#1a1a2e; color:white; padding:20px; min-height:100vh; }
        .reproductor { background:#16213e; padding:20px; border-radius:16px; margin-bottom:20px; }
        .caratula { width:150px; height:150px; background:#333; border-radius:12px; margin:10px 0; object-fit:cover; }
        .notificacion { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#0f3460; padding:15px 25px; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.5); z-index:9999; display:none; max-width:400px; }
        .historial { margin-top:20px; }
        .cancion { display:flex; align-items:center; gap:12px; background:#16213e; padding:10px; border-radius:8px; margin:8px 0; }
        .cancion img { width:50px; height:50px; border-radius:6px; object-fit:cover; background:#333; }
        audio { width:100%; margin:15px 0; }
        .estado { color:#aaa; font-size:14px; margin:10px 0; }
        .exito { color:#4ade80; }
        .error { color:#f87171; }
    </style>
</head>
<body>

    <h1>📻 Sikodark FM — PRUEBA</h1>

    <div class="reproductor">
        <h3 id="titulo">Esperando canción...</h3>
        <p id="artista">—</p>
        <img id="caratula" class="caratula" src="" alt="Carátula" onerror="this.src='https://sikodark256.github.io/sdkfm/logo-radio.png'">
        <audio id="reproductor" controls>
            <source src="TU_URL_DE_LA_RADIO_AQUI" type="audio/mpeg">
        
        <div class="estado" id="estado">🔄 Iniciando...</div>
    </div>

    <div class="notificacion" id="notificacion">
        <strong id="notif-genero"></strong>
        <p id="notif-texto"></p>
    </div>

    <div class="historial">
        <h3>📋 Historial</h3>
        <div id="lista-historial"></div>
    </div>

<script>
// ================= CONFIGURACIÓN =================
const URL_RADIO = "PON_AQUI_LA_URL_DE_TU_STREAM"; // ← PON TU URL AQUÍ
const URL_METADATA = "PON_AQUI_LA_URL_DE_METADATA_DE_ZENO"; // ← Tu metadata de Zeno
const historial = [];
let ultimaCancion = "";

// ================= SOBRESCRITURAS =================
const SOBRESCRITURAS = {
  "raphael": { genero: "Balada romántica", frase: "Raphael — icono de la balada romántica en español, una voz que ha marcado generaciones enteras." }
};

// ================= FRASES DE RESPALDO =================
const FRASES = [
  "🎧 Disfruta lo mejor en Sikodark FM.",
  "✨ Cada canción es una historia — déjate sorprender.",
  "🎶 Tu música, en el momento que lo necesitas."
];

// ================= INICIAR =================
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("estado").innerHTML = "✅ Página cargada";
  setInterval(leerMetadata, 12000);
  leerMetadata();
});

// ================= LEER METADATA =================
async function leerMetadata() {
  try {
    document.getElementById("estado").innerHTML = "🔄 Buscando metadata...";
    
    // Intenta con Zeno
    const res = await fetch(URL_METADATA);
    const texto = await res.text();
    
    // Extraer "Artista - Canción"
    const coincidencia = texto.match(/([^\-]+)\s*-\s*(.+)/);
    if (!coincidencia) throw new Error("Formato no reconocido");

    const artista = coincidencia[1].trim();
    const cancion = coincidencia[2].trim();
    const id = `${artista.toLowerCase()}||${cancion.toLowerCase()}`;

    if (id === ultimaCancion) {
      document.getElementById("estado").innerHTML = "✅ Sin cambios";
      return;
    }
    ultimaCancion = id;

    document.getElementById("estado").innerHTML = `✅ Nueva canción: ${artista} - ${cancion}`;
    document.getElementById("titulo").textContent = cancion;
    document.getElementById("artista").textContent = artista;

    // Buscar carátula
    buscarCaratula(artista, cancion);

    // Mostrar notificación
    await mostrarNotificacion(artista, cancion);

    // Agregar al historial
    agregarHistorial(artista, cancion, "");

  } catch (e) {
    document.getElementById("estado").innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
    usarMetadataSimple();
  }
}

// ================= BUSCAR CARÁTULA (iTunes) =================
async function buscarCaratula(artista, cancion) {
  try {
    const q = encodeURIComponent(`${artista} ${cancion}`);
    const res = await fetch(`https://itunes.apple.com/search?term=${q}&limit=1`);
    const datos = await res.json();
    if (datos.results.length > 0) {
      let url = datos.results[0].artworkUrl100.replace("100x100bb.jpg", "600x600bb.jpg");
      document.getElementById("caratula").src = url;
      actualizarHistorialCaratula(url);
      document.getElementById("estado").innerHTML += " ✅ Carátula: iTunes";
      return url;
    }
  } catch(e) {
    console.log("Sin carátula en iTunes");
  }
  return "";
}

// ================= MOSTRAR NOTIFICACIÓN =================
async function mostrarNotificacion(artista, cancion) {
  const clave = artista.toLowerCase().trim();
  let genero = "Música", frase = FRASES[Math.floor(Math.random() * FRASES.length)];

  // Revisar sobrescritura
  if (SOBRESCRITURAS[clave]) {
    genero = SOBRESCRITURAS[clave].genero;
    frase = SOBRESCRITURAS[clave].frase;
  } else {
    // Buscar género en iTunes
    try {
      const q = encodeURIComponent(artista);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&limit=5&entity=musicArtist`);
      const datos = await res.json();
      if (datos.results.length > 0) {
        genero = datos.results[0].primaryGenreName || "Música";
        if (tieneIngles(genero)) genero = "Música";
      }
      frase = `${artista} — una propuesta musical de ${genero} para ti.`;
    } catch {}
  }

  // Mostrar
  document.getElementById("notif-genero").textContent = genero;
  document.getElementById("notif-texto").textContent = frase;
  const notif = document.getElementById("notificacion");
  notif.style.display = "block";
  setTimeout(() => notif.style.display = "none", 8000);
}

// ================= AUXILIARES =================
function tieneIngles(texto) {
  const palabras = ["the","and","is","of","pop","rock","dance","soul","r&b","hip","hop","country","blues"];
  return palabras.some(p => texto.toLowerCase().includes(p));
}

function agregarHistorial(artista, cancion, caratula) {
  historial.unshift({ artista, cancion, caratula });
  if (historial.length > 10) historial.pop();
  renderHistorial();
}

function actualizarHistorialCaratula(url) {
  if (historial.length > 0) {
    historial[0].caratula = url;
    renderHistorial();
  }
}

function renderHistorial() {
  const lista = document.getElementById("lista-historial");
  lista.innerHTML = historial.map(c => `
    <div class="cancion">
      <img src="${c.caratula||''}" alt="">
      <div><strong>${c.artista}</strong><br>${c.cancion}</div>
    </div>
  `).join("");
}

// Fallback simple si Zeno falla
async function usarMetadataSimple() {
  // Aquí puedes poner un texto manual o otra fuente
}

</script>
</body>
</html>
